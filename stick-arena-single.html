<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Stick Arena 2.16</title>

<style>
/* css/00-foundation.css */
/* Stick Arena 2.9 — design foundation, typography and global behaviour */
:root {
  color-scheme: dark;
  --night-0: #090e19;
  --night-1: #101827;
  --night-2: #182337;
  --night-3: #223149;
  --ink: #191d27;
  --ink-soft: #343b49;
  --paper: #f2ecdc;
  --paper-light: #fffdf6;
  --paper-mid: #e7dfcc;
  --paper-line: #d3c9b4;
  --muted: #716d67;
  --muted-dark: #a7b0be;
  --gold: #e7ac36;
  --gold-light: #ffdb7b;
  --coral: #e65b5b;
  --mint: #3e9a78;
  --sky: #498fbb;
  --violet: #8066b7;
  --danger: #b64448;
  --success: #287654;
  --line-dark: rgba(22, 29, 42, .16);
  --line-light: rgba(255, 255, 255, .12);
  --shadow-ink: 0 4px 0 rgba(25, 29, 39, .92);
  --shadow-deep: 0 16px 42px rgba(0, 0, 0, .32);
  --shadow-soft: 0 8px 22px rgba(22, 28, 39, .12);
  --radius-xs: 7px;
  --radius-sm: 10px;
  --radius-md: 15px;
  --radius-lg: 22px;
  --ease-out: cubic-bezier(.2, .72, .25, 1);
  --ease-pop: cubic-bezier(.2, .9, .25, 1.25);
  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: "Russo One", Impact, "Arial Black", sans-serif;
  --font-copy: Neucha, "Trebuchet MS", sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  box-sizing: border-box;
  padding-top: var(--safe-top);
  padding-right: var(--safe-right);
  padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left);
}

*,
*::before,
*::after {
  box-sizing: inherit;
}

html {
  width: 100%;
  height: 100%;
  min-height: 100%;
  scroll-padding-top: var(--safe-top);
  scrollbar-gutter: stable;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--night-0);
  color: #f2f4f8;
  font: 15px/1.45 var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

body,
button,
input,
select,
textarea {
  font-family: var(--font-ui);
}

button,
input,
select,
textarea {
  font-size: inherit;
}

button {
  color: inherit;
}

button:focus {
  outline: none;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #347eb2;
  outline-offset: 3px;
}

::selection {
  color: var(--ink);
  background: var(--gold-light);
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: rgba(24, 35, 55, .08);
  border-radius: 20px;
}

::-webkit-scrollbar-thumb {
  background: rgba(66, 76, 91, .35);
  border: 2px solid transparent;
  border-radius: 20px;
  background-clip: padding-box;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(66, 76, 91, .58);
  border: 2px solid transparent;
  background-clip: padding-box;
}

h1,
h2,
h3,
h4,
p {
  margin-top: 0;
}

h1,
h2,
h3,
h4,
.bt,
.ch,
.evcost {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: .015em;
}

h1 {
  margin-bottom: 12px;
  color: var(--ink);
  font-size: clamp(38px, 7vw, 74px);
  line-height: .98;
  text-align: center;
  text-shadow: 3px 3px 0 var(--gold-light);
}

h1 span {
  color: var(--coral);
}

h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 24px 0 11px;
  color: var(--ink);
  font-size: clamp(15px, 2vw, 18px);
  line-height: 1.2;
  letter-spacing: .025em;
}

h2 b {
  display: inline-grid;
  flex: 0 0 27px;
  width: 27px;
  height: 27px;
  place-items: center;
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-display);
  font-size: 13px;
}

h2 small {
  margin: 0;
  color: var(--muted);
  font-family: var(--font-copy);
  font-size: .95em;
}

h3 {
  margin: 0 0 7px;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.2;
}

p {
  margin-bottom: 12px;
}

small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-family: var(--font-copy);
  font-size: 16px;
  line-height: 1.3;
}

strong {
  font-weight: 750;
}

img {
  max-width: 100%;
}

button,
select,
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
}

button {
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

input,
select,
textarea {
  min-width: 0;
}

input[type="range"] {
  height: 5px;
  border-radius: 20px;
  background: #c8c0b0;
  accent-color: var(--gold);
}

input[type="range"]::-webkit-slider-thumb {
  width: 18px;
  height: 18px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 2px 0 var(--ink);
  -webkit-appearance: none;
}

input[type="range"]::-moz-range-thumb {
  width: 15px;
  height: 15px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 2px 0 var(--ink);
}

select {
  min-height: 42px;
  padding: 8px 38px 8px 12px;
  border: 2px solid var(--ink);
  border-radius: var(--radius-sm);
  background-color: var(--paper-light);
  color: var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}

select option {
  background: var(--paper-light);
  color: var(--ink);
}

:where(.row, .mn, .pg, .mg, .wg, .evg) > * {
  min-width: 0;
}

[hidden] {
  display: none !important;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

</style>
<style>
/* css/10-stage-layout.css */
/* Stage, screen overlays, menu composition and information layout */
#w {
  position: relative;
  display: grid;
  width: 100%;
  height: 100dvh;
  min-height: 0;
  place-items: center;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 44%, rgba(48, 76, 111, .28), transparent 53%),
    radial-gradient(ellipse at 8% 90%, rgba(26, 69, 84, .18), transparent 30%),
    linear-gradient(145deg, #0b1220 0%, #101a2a 55%, #0a111d 100%);
}

#w::before {
  position: absolute;
  z-index: -1;
  inset: 0;
  background-image:
    linear-gradient(rgba(181, 201, 226, .025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(181, 201, 226, .025) 1px, transparent 1px);
  background-size: 40px 40px;
  content: "";
  pointer-events: none;
}

#w::after {
  position: absolute;
  z-index: -1;
  inset: 0;
  background: radial-gradient(ellipse, transparent 45%, rgba(0, 0, 0, .32) 100%);
  content: "";
  pointer-events: none;
}

canvas {
  display: block;
  max-width: 100vw;
  max-height: 100dvh;
  border: 1px solid rgba(218, 230, 247, .16);
  border-radius: 13px;
  background: #0d1420;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, .6),
    0 20px 65px rgba(0, 0, 0, .42),
    0 0 40px rgba(66, 107, 151, .08);
}

.sc {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: none;
  overflow-x: hidden;
  overflow-y: auto;
  padding: max(15px, var(--safe-top)) max(15px, var(--safe-right)) max(18px, var(--safe-bottom)) max(15px, var(--safe-left));
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 0, transparent 31px, rgba(114, 151, 172, .09) 32px, transparent 33px),
    linear-gradient(transparent 0, transparent 31px, rgba(114, 151, 172, .08) 32px, transparent 33px);
  background-size: 32px 32px;
  color: var(--ink);
  font-family: var(--font-copy);
  font-size: 19px;
  line-height: 1.38;
}

.sc::before {
  position: fixed;
  z-index: 0;
  inset: 0;
  background: linear-gradient(90deg, rgba(255, 255, 255, .24), transparent 16%, transparent 84%, rgba(66, 47, 23, .035));
  content: "";
  pointer-events: none;
}

.sc.on {
  display: flex;
  animation: screen-enter .2s var(--ease-out) both;
}

.sc .box {
  position: relative;
  z-index: 1;
  width: min(100%, 1040px);
  margin: auto;
  padding: 6px 4px 12px;
}

@keyframes screen-enter {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#menu {
  align-items: stretch;
  background:
    linear-gradient(90deg, rgba(5, 10, 18, .98) 0%, rgba(7, 14, 25, .92) 42%, rgba(7, 14, 25, .30) 100%),
    radial-gradient(ellipse at 74% 48%, rgba(35, 113, 156, .23), transparent 45%),
    linear-gradient(145deg, #0a111d, #17243a 64%, #0a101a);
  color: #f5f3ed;
  background-size: cover;
}

#menu::before {
  background-image:
    linear-gradient(120deg, transparent 0 62%, rgba(239, 183, 76, .045) 62.1% 62.3%, transparent 62.4%),
    repeating-linear-gradient(0deg, transparent 0 47px, rgba(176, 201, 224, .045) 48px, transparent 49px);
}

#menu .box {
  width: min(100%, 1050px);
  margin: auto auto auto clamp(22px, 8vw, 125px);
  padding: clamp(15px, 4vw, 44px) 0;
}

#menu h1 {
  width: fit-content;
  margin: 0 0 18px;
  color: #f5f4ee;
  font-size: clamp(52px, 10.5vw, 120px);
  line-height: .88;
  letter-spacing: -.015em;
  text-align: left;
  text-shadow:
    4px 4px 0 #a73f4b,
    8px 8px 0 rgba(0, 0, 0, .8),
    0 18px 35px rgba(0, 0, 0, .25);
  transform: rotate(-2deg);
}

#menu h1 span {
  color: var(--gold-light);
}

#menu p {
  max-width: 590px;
  margin: 18px 0 0;
  color: #d2dbe6;
  font-size: clamp(17px, 2.2vw, 23px);
  line-height: 1.32;
  text-align: left;
  text-wrap: pretty;
}

.mn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  margin-top: 28px;
}

#menu .mn .bt:not(.big) {
  min-width: 210px;
  background: rgba(230, 238, 247, .08);
  border-color: rgba(227, 235, 245, .32);
  color: #f0f3f8;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .5);
}

#menu .mn .bt:not(.big):hover {
  background: rgba(230, 238, 247, .15);
}

#menu .bt.big {
  min-width: 240px;
}

.sc:not(#menu) h1 {
  color: var(--ink);
  text-shadow: 3px 3px 0 var(--gold-light);
}

.sc:not(#menu) .box > p {
  color: var(--ink-soft);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
}

.pg {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.mg {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 17px;
}

.wg {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 13px;
  align-items: stretch;
}

.bar {
  position: sticky;
  z-index: 2;
  bottom: -18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 22px;
  padding: 18px 0 8px;
  background: linear-gradient(180deg, rgba(242, 236, 220, 0), rgba(242, 236, 220, .94) 33%, var(--paper) 100%);
}

.bar > span {
  min-width: 0;
}

#end .box,
#pause .box {
  max-width: 780px;
  text-align: center;
}

#end h1,
#pause h1 {
  margin-bottom: 18px;
}

#end p,
#pause p {
  font-size: 20px;
}

#help .box {
  max-width: 1120px;
}

#setup .box {
  max-width: 1180px;
}

#evo .box {
  max-width: 1220px;
}

#help table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  overflow: hidden;
  border: 1px solid var(--paper-line);
  border-radius: 11px;
  background: rgba(255, 253, 246, .85);
}

#help td {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(65, 60, 53, .11);
  text-align: left;
  vertical-align: top;
}

#help tr:last-child td {
  border-bottom: 0;
}

#help tr:nth-child(even) td {
  background: rgba(232, 224, 208, .28);
}

@media (max-width: 760px) {
  .mg {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .pg {
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .wg {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .sc .box {
    padding-right: 1px;
    padding-left: 1px;
  }
}

</style>
<style>
/* css/20-ui-components.css */
/* Buttons, player cards, map tiles, weapon index and selection states */
.bt,
.ch,
.ks button {
  position: relative;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  min-height: 42px;
  padding: 8px 13px;
  border: 2px solid var(--ink);
  border-radius: 11px 8px 12px 7px;
  background: var(--paper-light);
  color: var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer;
  font-size: 15px;
  line-height: 1.15;
  text-align: center;
  text-decoration: none;
  transition:
    transform .14s var(--ease-out),
    box-shadow .14s var(--ease-out),
    background-color .14s ease,
    border-color .14s ease,
    color .14s ease;
}

.bt {
  font-family: var(--font-display);
  letter-spacing: .015em;
}

.bt:hover,
.ch:hover,
.ks button:hover {
  border-color: #10151d;
  background: #fff;
  transform: translate(-1px, -2px);
  box-shadow: 4px 5px 0 var(--ink);
}

.bt:active,
.ch:active,
.ks button:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--ink);
}

.bt:disabled,
.ch:disabled,
.ks button:disabled {
  opacity: .45;
  cursor: not-allowed;
  filter: grayscale(.35);
  transform: none;
  box-shadow: 2px 2px 0 rgba(25, 29, 39, .45);
}

.bt.big {
  min-height: 54px;
  padding: 13px 30px;
  border-width: 3px;
  border-radius: 13px 8px 14px 7px;
  background: linear-gradient(180deg, #ffdf83 0%, #f1b83f 100%);
  color: #292016;
  box-shadow: 4px 5px 0 #1b1c23, 0 8px 20px rgba(207, 148, 42, .15);
  font-size: 21px;
  letter-spacing: .035em;
}

.bt.big:hover {
  background: linear-gradient(180deg, #ffe8a4 0%, #ffd061 100%);
  box-shadow: 5px 7px 0 #1b1c23, 0 11px 24px rgba(207, 148, 42, .2);
}

.bt.big:active {
  box-shadow: 1px 2px 0 #1b1c23;
}

.bt:not(.big) {
  font-size: 14px;
}

.ch {
  min-height: 38px;
  padding: 7px 12px;
  font-size: 14px;
}

.ch.on {
  border-color: #2d281f;
  background: linear-gradient(180deg, #ffe7a5 0%, #f5c65b 100%);
  color: #211a10;
  box-shadow: 3px 3px 0 #262119, inset 0 1px 0 rgba(255, 255, 255, .55);
}

.ch.s {
  min-height: 32px;
  padding: 5px 9px;
  border-width: 1.5px;
  border-radius: 8px;
  box-shadow: 2px 2px 0 var(--ink);
  font-size: 12px;
  letter-spacing: 0;
}

.ch.locked,
.ch:disabled {
  border-style: dashed;
  opacity: .46;
  cursor: not-allowed;
  filter: saturate(.35);
}

.ch.locked:hover,
.ch:disabled:hover {
  transform: none;
  box-shadow: 2px 2px 0 var(--ink);
}

#menu .bt.big {
  border-color: #252b35;
}

#menu .bt.big::after {
  position: absolute;
  right: 11px;
  width: 7px;
  height: 7px;
  border-top: 2px solid currentColor;
  border-right: 2px solid currentColor;
  content: "";
  opacity: .6;
  transform: rotate(45deg);
}

.pn {
  display: flex;
  flex: 1 1 300px;
  align-items: flex-start;
  gap: 14px;
  min-width: 0;
  padding: 14px;
  border: 1.5px solid #c8bda8;
  border-radius: 16px 11px 15px 10px;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, .88), rgba(255, 252, 243, .94)),
    var(--paper-light);
  box-shadow: 0 5px 15px rgba(34, 32, 28, .08), 3px 3px 0 rgba(28, 28, 32, .82);
}

.pn > div {
  flex: 1;
  min-width: 0;
}

.pn h3 {
  margin-bottom: 8px;
}

.pv {
  flex: 0 0 96px;
  width: 96px;
  max-width: 30%;
  border: 1px solid rgba(45, 42, 38, .12);
  border-radius: 10px;
  background: #e7e0d0;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7);
}

.sw {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 9px 0 12px;
}

.sw i {
  display: block;
  width: 25px;
  height: 25px;
  border: 2px solid rgba(25, 29, 39, .85);
  border-radius: 50%;
  box-shadow: 0 2px 0 rgba(25, 29, 39, .22);
  cursor: pointer;
  transition: transform .12s ease, outline-color .12s ease;
}

.sw i:hover {
  transform: scale(1.12);
}

.sw i.on {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

.ks {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin-top: 11px;
}

.ks button {
  justify-content: space-between;
  min-width: 0;
  min-height: 36px;
  padding: 6px 8px;
  border-width: 1.5px;
  border-radius: 8px;
  box-shadow: 2px 2px 0 var(--ink);
  font-family: var(--font-copy);
  font-size: 15px;
  text-align: left;
}

.ks button b {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.ks button.on {
  background: #f4b8ad;
  color: #311f21;
}

.mc {
  position: relative;
  min-width: 0;
  padding: 8px 8px 9px;
  overflow: visible;
  border: 1.5px solid #bdb39f;
  border-radius: 11px 15px 10px 14px;
  background: rgba(255, 253, 247, .88);
  box-shadow: 0 4px 12px rgba(34, 32, 28, .08), 2px 2px 0 rgba(25, 29, 39, .85);
  cursor: pointer;
  opacity: .84;
  text-align: left;
  transition:
    transform .16s var(--ease-out),
    opacity .16s ease,
    box-shadow .16s ease,
    border-color .16s ease;
}

.mc:nth-child(3n + 1) {
  transform: rotate(-.35deg);
}

.mc:nth-child(3n + 2) {
  transform: rotate(.4deg);
}

.mc:hover {
  z-index: 1;
  opacity: 1;
  box-shadow: 0 8px 17px rgba(34, 32, 28, .13), 3px 4px 0 rgba(25, 29, 39, .9);
  transform: translateY(-2px) rotate(0);
}

.mc.on {
  border-color: #b88b2c;
  background: #fff8df;
  opacity: 1;
  box-shadow: 0 0 0 2px rgba(226, 173, 57, .34), 3px 4px 0 var(--ink);
}

.mc.on::after {
  position: absolute;
  z-index: 2;
  top: -10px;
  right: -8px;
  display: grid;
  width: 29px;

  color: #642a31;
  box-shadow: 3px 4px 0 #783a3c;
}

.evg {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
  align-items: stretch;
  gap: 12px;
  padding: 2px 2px 5px;
}

.evc {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 146px;
  padding: 13px 14px 12px;
  overflow: hidden;
  border: 1.5px solid #c7bdab;
  border-radius: 13px 10px 14px 9px;
  background: linear-gradient(145deg, #fffdf8 0%, #f4eedf 100%);
  color: var(--ink);
  box-shadow: 0 4px 12px rgba(35, 33, 28, .07), 2px 2px 0 rgba(25, 29, 39, .82);
  font-size: 15px;
  line-height: 1.32;
  transition:
    transform .16s var(--ease-out),
    box-shadow .16s ease,
    border-color .16s ease,
    opacity .16s ease,
    filter .16s ease;
}

.evc::before {
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 4px;
  background: #9b9aa0;
  content: "";
}

.evc:nth-child(3n + 1)::before {
  background: linear-gradient(90deg, #4c91b6, #8ec4d7);
}

.evc:nth-child(3n + 2)::before {
  background: linear-gradient(90deg, #b68a3a, #e8c26b);

.evc:nth-child(3n)::before {
  background: linear-gradient(90deg, #8565ad, #c4a7dc);
}

.evc:hover {
  z-index: 1;
  border-color: #95886f;
  box-shadow: 0 8px 18px rgba(35, 33, 28, .11), 3px 4px 0 rgba(25, 29, 39, .88);

  box-shadow: 0 0 0 2px rgba(62, 154, 120, .15), 0 4px 12px rgba(35, 33, 28, .08), 2px 2px 0 #2e6f54;
}

.evc.own::before {
  height: 5px;
  background: linear-gradient(90deg, #2d8b63, #8acb9b);
}

.evc.lock {
  border-style: dashed;
  background: linear-gradient(145deg, #eeece6 0%, #e3e0d7 100%);
  opacity: .48;
  filter: saturate(.48);
}

.evc.lock:hover {

.evbar {

/* ---------- ТУРЕЛИ: прочность 100, враги атакуют, эволюция ---------- */
function turretSegmentHitsRect(x1,y1,x2,y2,left,top,right,bottom){const dx=x2-x1,dy=y2-y1;let lo=0,hi=1;const p=[-dx,dx,-dy,dy],q=[x1-left,right-x1,y1-top,bottom-y1];for(let i=0;i<4;i++){if(Math.abs(p[i])<1e-8){if(q[i]<0)return false;continue}const r=q[i]/p[i];if(p[i]<0){if(r>hi)return false;if(r>lo)lo=r}else{if(r<lo)return false;if(r<hi)hi=r}}return hi>=lo&&hi>.012&&lo<.988}
function turretPlatformBlocks(x1,y1,x2,y2){if(!M)return false;for(const p of M.pl||[])if(turretSegmentHitsRect(x1,y1,x2,y2,p[0],p[1],p[0]+p[2],p[1]+17))return true;for(const p of DY.pl||[])if(p.solid!==false&&turretSegmentHitsRect(x1,y1,x2,y2,p.x,p.y,p.x+p.w,p.y+(p.h||17)))return true;return false}
function mkTurret(e,power,owner){const v=e.ev||{},mh=Math.round(100*(v.tHp||1));return{x:cl(e.x+e.f*48,28,W-28),y:e.y,tm:e.tm,hp:mh,mh,cd:.32,range:Math.min(480,410*(v.tRange||1)),dmg:17*(power||1)*(v.tDm||1),rate:v.tRate||1,decM:v.tDec||1,repA:v.tRep||0,evoAdj:v.tEvo||0,angle:e.f>0?0:Math.PI,c:owner?'#8ce5ff':e.c,src:e,isTur:1,kind:'g',kills:0,w:34,h:36,fl:0,ownerSlime:owner||null,born:G.t,rep:0}}
function placeTurret(e,power,owner){if(!e||!e.og||Math.abs(e.vy||0)>45)return false;for(const t of TUR)if(t.src===e&&t.hp>0)t.hp=0;TUR.push(mkTurret(e,power,owner));return true}   // одна турель, только на твёрдой поверхности
function hitTur(t,d,s){if(t.hp<=0||d<=0)return;t.hp-=d;t.fl=.12;fx(t.x,t.y-18,4,'#cbd2df',150);if(R()<.6)TX.push({x:t.x+(R()-.5)*16,y:t.y-48,t:'-'+Math.round(d),l:.55,c:'#ffd0a0'})}
function turretKill(t){if(!TUR.includes(t)||t.hp<=0)return;t.kills=(t.kills||0)+1;
 if(t.kills>30+(t.evoAdj||0)&&t.kind=='g'){t.kind=R()<.5?'e':'r';t.mh=130;t.hp=t.mh;fx(t.x,t.y-20,30,t.kind=='e'?'#63eaff':'#ffb347',380);RG.push({x:t.x,y:t.y-20,l:.4,big:1});G.sh=Math.max(G.sh,8);TX.push({x:t.x,y:t.y-60,t:t.kind=='e'?'ЭВОЛЮЦИЯ: ЭЛЕКТРО-ТУРЕЛЬ!':'ЭВОЛЮЦИЯ: РАКЕТНАЯ ТУРЕЛЬ!',l:1.6,c:t.kind=='e'?'#8feeff':'#ffc170'})}}
function zTgt(e){const t=near(e),hunt=zombieCanClimb(e)?.78:.12;let best=t?verticalTargetCost(e,t,hunt):1e9,r=t;
 for(const u of TUR){if(u.tm==e.tm||u.hp<=0)continue;const d=verticalTargetCost(e,u,.08)*.72;if(d<best){best=d;r=u}}return r}
function updTurrets(dt){
 for(const t of TUR){t.cd-=dt;t.fl=Math.max(0,t.fl-dt);
  const eng=ents.some(o=>o.hp>0&&CH[o.ch].engineer&&o.tm==t.tm&&Math.hypot(o.x-t.x,o.y-o.h*.5-(t.y-18))<170);t.rep=eng?1:0;
  const dl=eng?-Math.max(.6,2*(t.decM||1)-(t.repA||0)):-5*(t.decM||1);
  t.hp=Math.min(t.mh,t.hp+dl*dt);
  if(dl>0&&R()<dt*6)PT.push({x:t.x+(R()-.5)*28,y:t.y-12,vx:0,vy:-55,g:-30,l:.6,c:'#7ee08a',r:2.2});
  let target=null,best=t.range;
  for(const o of ents){if(o.hp<=0||o.tm==t.tm||o.bat>0)continue;const ty=o.y-o.h*.55-(t.y-22),d=Math.hypot(o.x-t.x,ty);if(d<best&&!turretPlatformBlocks(t.x,t.y-22,o.x,o.y-o.h*.55)){best=d;target=o}}
  if(target){const dx=target.x-t.x,dy=target.y-target.h*.55-(t.y-22);t.angle=Math.atan2(dy,dx);
   if(t.cd<=0){const d=Math.max(1,Math.hypot(dx,dy)),mx=t.x+Math.cos(t.angle)*18,my=t.y-22+Math.sin(t.angle)*18,rt=t.rate||1;
    if(t.kind=='e'){t.cd=1.15/rt;chainBolt(t,target,t.dmg*.95,null,{ox:mx,oy:my,n:4,range:175,fall:.85})}
    else if(t.kind=='r'){t.cd=2.25/rt;pr({x:mx,y:my,vx:dx/d*360,vy:dy/d*360,dm:t.dmg*1.6,tm:t.tm,t:'r',col:'#ffb347',src:t,life:3.4,turretShot:1})}
    else{t.cd=.62/rt;pr({x:mx,y:my,vx:dx/d*560,vy:dy/d*560,dm:t.dmg,tm:t.tm,t:'b',col:'#8ce5ff',life:1.35,src:t,turretShot:1})}
    fx(mx,my,5,t.kind=='e'?'#63eaff':t.kind=='r'?'#ffb347':'#8ce5ff',110)}}}
 TUR=TUR.filter(t=>{if(t.hp>0)return 1;fx(t.x,t.y-14,26,'#ffb347',300);fx(t.x,t.y-14,12,'#8ce5ff',200);RG.push({x:t.x,y:t.y-14,l:.3});TX.push({x:t.x,y:t.y-52,t:'ТУРЕЛЬ РАЗРУШЕНА',l:1,c:'#ff9a6a'});return 0})}

/* ---------- БАРЬЕР ШТУРМОВИКА ---------- */
function mkWall(e){const v=e.ev||{},hp=Math.round(16*(v.wHp||1));return{x:cl(e.x,130,W-130),y:cl(e.y-142,150,GY-95),bottom:e.y,tm:e.tm,src:e,hp,max:hp,age:0,dec:v.wDec||1}}
function updWalls(dt){for(const w of WALLS){w.age+=dt;w.hp-=dt*(w.dec||1);               // прочность падает на 1 в секунду
  if(R()<dt*18)PT.push({x:w.x+(R()-.5)*190,y:w.y+R()*(w.bottom-w.y),vx:(R()-.5)*30,vy:-25,g:0,l:.35,c:'#ffcb82',r:1.5+R()*2})}
 for(const w of WALLS)if(w.hp<=0){fx(w.x,w.y+55,26,'#ffb45e',320);TX.push({x:w.x,y:w.y-20,t:'БАРЬЕР РАЗРУШЕН',l:1,c:'#ffb45e'})}
 WALLS=WALLS.filter(w=>w.hp>0)}
function blockMonsterByWalls(e,oldX,oldY){const half=e.w*.5;
 for(const w of WALLS){if(w.tm==e.tm||w.hp<=0)continue;const l=w.x-96,r=w.x+96,top=w.y,bottom=w.bottom;
  if(e.y<top-5||e.y-e.h>bottom+5)continue;
  const inside=e.x>l-half+2&&e.x<r+half-2&&e.y>top+6&&e.y-e.h<bottom;
  if(inside&&!(oldY<=top+1&&e.vy>=0)){if(e.x-(l-half)<(r+half)-e.x){e.x=l-half;if(e.vx>0)e.vx=0}else{e.x=r+half;if(e.vx<0)e.vx=0}continue}
  if(oldX+half<l&&e.x+half>=l&&e.vx>0){e.x=l-half;e.vx=0}else if(oldX-half>l&&e.x-half<=l&&e.vx<0){e.x=l+half;e.vx=0}else if(oldX+half<r&&e.x+half>=r&&e.vx>0){e.x=r-half;e.vx=0}else if(oldX-half>r&&e.x-half<=r&&e.vx<0){e.x=r+half;e.vx=0}
  if(e.x>l-half&&e.x<r+half&&oldY<=top&&e.y>=top&&e.vy>0){e.y=top;e.vy=0;e._onwall=1}}}
function wallHurt(w,d){w.hp-=d;fx(w.x+(R()-.5)*180,w.y+R()*(w.bottom-w.y),6,'#9cecff',170)}
function wallAttack(e,dmg){const half=e.w*.5;for(const w of WALLS){if(w.tm==e.tm||w.hp<=0)continue;const l=w.x-96,r=w.x+96;if(e.y<w.y-5||e.y-e.h>w.bottom+5)continue;
  if((e.f>0&&Math.abs(e.x+half-l)<14)||(e.f<0&&Math.abs(e.x-half-r)<14)){wallHurt(w,dmg);TX.push({x:e.x+e.f*30,y:e.y-e.h*.6,t:'-'+dmg,l:.5,c:'#ffb45e'});return true}}return false}
function wallMelee(e,reach,dmg){let h=0;for(const w of WALLS){if(w.tm==e.tm||w.hp<=0||e.y<w.y-10||e.y-e.h>w.bottom+10)continue;const l=w.x-96,r=w.x+96,fx0=e.x+e.f*reach;if(e.f>0?(e.x<r&&fx0>l-20):(e.x>l&&fx0<r+20)){wallHurt(w,dmg);h++}}return h}
function wallLimit(x,y,f,tm,dmg){let best=null;for(const w of WALLS){if(w.tm==tm||w.hp<=0||y<w.y||y>w.bottom)continue;const l=w.x-96,r=w.x+96,edge=f>0?l:r;if((edge-x)*f>0&&(best==null||(edge-best.e)*f<0))best={e:edge,w}}if(best){wallHurt(best.w,dmg||2);return best.e}return null}
function blockEnemyBeam(x1,y1,x2,y2,tm){for(const w of WALLS){if(w.hp<=0||(tm!=null&&w.tm==tm))continue;const l=w.x-96,r=w.x+96,top=w.y,bottom=w.bottom;const edges=[[l,top,l,bottom],[r,top,r,bottom],[l,top,r,top]];
  for(const[ax,ay,bx,by]of edges){const den=(x1-x2)*(ay-by)-(y1-y2)*(ax-bx);if(Math.abs(den)<.0001)continue;const t=((x1-ax)*(ay-by)-(y1-ay)*(ax-bx))/den,u=-((x1-x2)*(y1-ay)-(y1-y2)*(x1-ax))/den;if(t>=0&&t<=1&&u>=0&&u<=1){wallHurt(w,2);fx(ax,ay,8,'#9cecff',180);return true}}}return false}
function blockEnemyProjectile(p,oldX,oldY){if(p.t=='h')return false;
 for(const w of WALLS){if(w.hp<=0||w.tm==p.tm)continue;const l=w.x-96,r=w.x+96,top=w.y,bottom=w.bottom;let b=false;
  if(((oldX<l&&p.x>=l)||(oldX>l&&p.x<=l))&&p.y>=top-4&&p.y<=bottom+4)b=true;
  else if(((oldX<r&&p.x>=r)||(oldX>r&&p.x<=r))&&p.y>=top-4&&p.y<=bottom+4)b=true;
  else if(((oldY<top&&p.y>=top)||(oldY>top&&p.y<=top))&&p.x>=l&&p.x<=r)b=true;
  if(b){wallHurt(w,(p.t=='r'||p.t=='g'||p.t=='z'||p.big)?3:1);p.life=0;fx(p.x,p.y,8,'#9cecff',190);return true}}return false}

/* ---------- ДРОНЫ (босс-паук и «Рой дронов») ---------- */
function spawnDrone(x,y,tm,src,dm,o){o=o||{};DR.push({x,y,vx:o.vx||0,vy:o.vy==null?-160:o.vy,tm,src,dm,life:o.life||3,r:o.r||85,hp:1,ph:R()*6,age:0,col:o.col||'#ff5a4a',aid:o.aid})}
function droneBoom(d){fx(d.x,d.y,26,d.col,380);fx(d.x,d.y,12,'#ffe9a8',300);RG.push({x:d.x,y:d.y,l:.32});G.sh=Math.max(G.sh,6);
 blastArea(d.x,d.y,d.r,d.dm,d.src,d.tm,d.aid,300)}
function updDR(dt0){
 for(const d of DR){const dt=dt0*tsAt(d.x,d.y,d.tm);d.age+=dt;d.life-=dt;
  let tg=null,bd=1e9;for(const o of ents)if(o.hp>0&&o.tm!=d.tm&&!(o.bat>0)){const q=Math.hypot(o.x-d.x,o.y-o.h*.5-d.y);if(q<bd){bd=q;tg=o}}
  if(tg&&d.age>.3){const dx=tg.x-d.x,dy=tg.y-tg.h*.5-d.y,m=Math.max(1,Math.hypot(dx,dy));d.vx+=dx/m*620*dt;d.vy+=dy/m*620*dt+Math.sin(d.age*10+d.ph)*40*dt;const sp=Math.hypot(d.vx,d.vy);if(sp>310){d.vx*=310/sp;d.vy*=310/sp}}
  else{d.vx*=1-dt*1.4;d.vy*=1-dt*1.4}
  d.x=cl(d.x+d.vx*dt,10,W-10);d.y=cl(d.y+d.vy*dt,20,GY-10);
  if(R()<dt*40)PT.push({x:d.x,y:d.y,vx:(R()-.5)*30,vy:(R()-.5)*30,g:0,l:.3,c:'#ff9a5a',r:1.6});
  if(d.age>.25)for(const o of ents)if(o.hp>0&&o.tm!=d.tm&&!(o.bat>0)&&Math.abs(o.x-d.x)<o.w/2+13&&d.y>o.y-o.h-10&&d.y<o.y+8){d.life=0;break}
  if(d.life>0)for(const p of P)if(p.life>0&&p.tm!=d.tm&&p.t!='f'&&p.t!='h'&&Math.hypot(p.x-d.x,p.y-d.y)<18){if(p.t!='q')p.life=0;d.shot=1;break}}
 DR=DR.filter(d=>{if(d.shot){fx(d.x,d.y,12,'#cbd2df',260);spark(d.x,d.y,8,'#ffd37a');TX.push({x:d.x,y:d.y-16,t:'СБИТ',l:.6,c:'#cbd2df'});return 0}if(d.life>0)return 1;droneBoom(d);return 0})}

/* ---------- ЛУЧИ БОССА (HZ) И ГРОЗОВЫЕ УДАРЫ ---------- */
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1;let t=((px-x1)*dx+(py-y1)*dy)/l2;t=cl(t,0,1);return Math.hypot(px-(x1+dx*t),py-(y1+dy*t))}
function hzBeam(h,dt){
 const o=h.org();h.ox=o[0];h.oy=o[1];
 if(h.t<h.wt){if(h.track&&h.track.hp>0&&h.t<h.wt-.28)h.ang=Math.atan2(h.track.y-h.track.h*.5-h.oy,h.track.x-h.ox)+(h.off||0);if(h.ang==null)h.ang=h.a0}
 else{if(h.sweep){const k=cl((h.t-h.wt)/h.dur,0,1);h.ang=h.a0+(h.a1-h.a0)*k}}
 const sn=Math.sin(h.ang),cs=Math.cos(h.ang);let L=2600;if(sn>.03)L=Math.min(L,(GY-h.oy)/sn);h.len=Math.max(40,L);
 h.ex=h.ox+cs*h.len;h.ey=h.oy+sn*h.len;
 if(h.t>=h.wt){
  if(!h.chk){h.chk=1;h.blocked=blockEnemyBeam(h.ox,h.oy,h.ex,h.ey,h.tm);G.sh=Math.max(G.sh,6);if(h.blocked)TX.push({x:h.ox,y:h.oy+30,t:'БЛОК',l:.6,c:'#8eeeff'})}
  h.tk-=dt;
  if(!h.blocked&&h.tk<=0){h.tk=h.tick||.12;
   for(const e of ents){if(e.hp<=0||e.tm==h.tm)continue;if(!h.sweep&&h.hit.includes(e))continue;
    const r=h.w/2+e.w/2,px=e.x;if(Math.min(segDist(px,e.y-e.h*.5,h.ox,h.oy,h.ex,h.ey),segDist(px,e.y-6,h.ox,h.oy,h.ex,h.ey),segDist(px,e.y-e.h+6,h.ox,h.oy,h.ex,h.ey))<r){h.hit.push(e);hit(e,h.dm,h.src,Math.sign(cs)*60,0,1,h.aid)}}
   for(const t of TUR)if(t.hp>0&&t.tm!=h.tm&&segDist(t.x,t.y-18,h.ox,h.oy,h.ex,h.ey)<h.w/2+18)hitTur(t,h.dm*.5,h.src)}
  if(R()<dt*60)PT.push({x:h.ex+(R()-.5)*30,y:h.ey+(R()-.5)*10,vx:(R()-.5)*260,vy:-R()*220,g:600,l:.4,c:h.c,r:2+R()*2})}
 if(h.t>h.wt+h.dur)h.dead=1}
function hzBolt(h,dt){if(h.t<h.wt||h.done)return;h.done=1;h.dead=1;
 let f=null,bd=130;for(const q of ents){if(q.hp<=0||q.tm==h.tm||q.bat>0)continue;const d=Math.hypot(q.x-h.x,q.y-q.h*.5-(h.y-30));if(d<bd){bd=d;f=q}}
 const sx=h.x+(R()-.5)*60,sy=-80;
 for(let i=0;i<2;i++)ZP.push({x1:sx,y1:sy,x2:h.x,y2:h.y-24,life:.32,c:i?'#ffffff':'#9ad7ff'});
 fx(h.x,h.y-20,24,'#9ad7ff',420);RG.push({x:h.x,y:h.y-10,l:.4,big:1});G.sh=Math.max(G.sh,10);
 if(f)chainBolt(h.src,f,h.dm,h.aid,{ox:h.x,oy:h.y-30,n:4,range:230,c:'#9ad7ff'});else spark(h.x,h.y-20,14,'#9ad7ff')}

function propDrop(){const ks=['barrel','barrel','barrel','gen','gen','cryo'];spawnProp(ks[R()*ks.length|0],120+R()*(W-240),-80,{fell:1})}
function damageProp(o,d,src,aid,kx){if(o.dead)return;o.hp-=d;o.fl=.12;if(src){o.src=credOf(src);if(aid!=null)o.aid=aid}o.vx+=(kx||0)*.25;
 fx(o.x,o.y-o.h*.5,3,'#ffe0a8',170);if(o.k=='gen'&&R()<.5)ZP.push({x1:o.x,y1:o.y-o.h,x2:o.x+(R()-.5)*60,y2:o.y-o.h-20-R()*30,life:.12,c:'#7fe8ff'});if(o.hp<=0)explodeProp(o)}
function explodeProp(o){if(o.dead)return;o.dead=1;const x=o.x,y=o.y-o.h*.5,src=o.src,tm=src&&src.tm!=null?src.tm:(o.tm!=null?o.tm:null),aid=o.aid,ztm=tm==null?-1:tm;
 if(o.k=='barrel'){fx(x,y,46,'#ff8a3a',480);fx(x,y,22,'#ffe08a',360);fx(x,y,14,'#333',220);RG.push({x,y,l:.45,big:1});G.sh=Math.max(G.sh,15);blastArea(x,y,150,72,src,tm,aid,560);const z=zone(x,o.y,115,.15,4.6,ztm,src,5,'#ff8a3a',0,aid);z.bn=1;TX.push({x,y:y-44,t:'ВЗРЫВ БЕНЗИНА!',l:.9,c:'#ffb35a'})}
 else if(o.k=='gen'){fx(x,y,36,'#7fe8ff',460);fx(x,y,18,'#fff',380);RG.push({x,y,l:.45,big:1});G.sh=Math.max(G.sh,12);blastArea(x,y,115,46,src,tm,aid,380);
  let f=null,bd=440;for(const q of ents){if(q.hp<=0||(tm!=null&&q.tm==tm))continue;const dd=Math.hypot(q.x-x,q.y-q.h*.5-y);if(dd<bd){bd=dd;f=q}}
  if(f)chainBolt(src||{tm:-1,x,y,h:30},f,38,aid,{ox:x,oy:y,n:5,range:270,c:'#7fe8ff'});zone(x,o.y,100,.1,3.4,ztm,src,4,'#7fe8ff',1,aid);TX.push({x,y:y-44,t:'ЗАМЫКАНИЕ!',l:.9,c:'#9ff0ff'})}
 else if(o.k=='cryo'){fx(x,y,40,'#bfeaff',420);fx(x,y,18,'#fff',300);RG.push({x,y,l:.45,big:1});G.sh=Math.max(G.sh,10);blastArea(x,y,165,14,src,tm,aid,260,2.6);zone(x,o.y,150,.1,4.5,ztm,src,2,'#9fe3ff',1,aid);TX.push({x,y:y-44,t:'ЗАМОРОЗКА!',l:.9,c:'#bfeaff'})}
 else{fx(x,y,30,'#ffb347',420);fx(x,y,12,'#666',200);RG.push({x,y,l:.35});G.sh=Math.max(G.sh,10);blastArea(x,y,115,o.dm||70,src,tm,aid,520)}}
function propSurface(o,py){let best=null;if(o.y>=GY)best=GY;
 if(o.vy>=0){for(const p of M.pl)if(o.x>p[0]&&o.x<p[0]+p[2]&&py<=p[1]+1&&o.y>=p[1])best=best==null?p[1]:Math.min(best,p[1]);
  for(const p of DY.pl)if(p.solid&&o.x>p.x&&o.x<p.x+p.w&&py<=p.y+5+Math.abs(p.dy)&&o.y>=p.y&&(best==null||p.y<best)){best=p.y;o.stand=p}}return best}

 }

  if(row.length&&row[0].x<46){const shift=46-row[0].x;for(const p of row)p.x+=shift}
 }

  const offsets=[0,-92,92,-166,166,-238,238,-310,310];
  for(const off of offsets){
   const x=cl(Math.round(cx+off-w/2),42,W-42-w),center=x+w/2,yy=Math.round(y);

  }

 };

  addStep((centralA.cx+centralB.cx)/2,(centralA.y+centralB.y)/2,92);
 }
 m.pl=platforms;
}
