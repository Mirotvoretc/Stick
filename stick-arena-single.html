const SLIME_UNLOCK_KEY='stick-arena-slime-unlocks-v1';
const SLIME_UNLOCK_KILLS=250;

function slimeLoadProgress(){try{const v=JSON.parse(localStorage.getItem(SLIME_UNLOCK_KEY)||'{}');return{players:Array.from({length:3},(_,i)=>!!(v.players&&v.players[i])),kills:Array.from({length:3},(_,i)=>Math.max(0,Math.min(SLIME_UNLOCK_KILLS,Number(v.kills&&v.kills[i])||0)))}}catch(e){return{players:[false,false,false],kills:[0,0,0]}}}

function slimeUnlock(slot){slot=slot|0;if(slot<0||slot>2||SLIME_UNLOCKS[slot])return false;SLIME_UNLOCKS[slot]=true;slimeSaveUnlocks();return true}
function slimeUnlockNotice(source){if(!source)return;TX.push({x:source.x,y:source.y-source.h-36,t:'НОВЫЙ КЛАСС: СЛИЗЬ!',l:2.4,c:'#55b9ff'});fx(source.x,source.y-source.h*.55,36,'#299dff',440)}
function slimeRecordZombieKill(source){if(!source||source.pi==null)return;const slot=source.pi|0;if(slot<0||slot>2||SLIME_UNLOCKS[slot])return;SLIME_KILLS[slot]=Math.min(SLIME_UNLOCK_KILLS,(SLIME_KILLS[slot]||0)+1);if(SLIME_KILLS[slot]>=SLIME_UNLOCK_KILLS){if(slimeUnlock(slot))slimeUnlockNotice(source)}else slimeSaveUnlocks()}

function slimeWeaponAmmo(e,weaponId){const w=WP[weaponId];if(!w)return 1e9;if(!CH[e.ch].slime||w.am>=1e8)return w.am;return Math.max(1,Math.floor(w.am/1.7))}

function slimeOnKill(victim,source){if(!victim||!source||source.ch!=12||source.pi==null)return;const by=victim.damageBySlot||{},mine=by[source.pi]||0,others=Object.keys(by).reduce((n,k)=>Math.max(n,Number(k)!==source.pi?(by[k]||0):0),0);if(mine<=others)return;let bonus=0;if(victim.B){if(mine<=victim.mh*.5)return;bonus=.3}else if(victim.z||victim.pi!=null){bonus=victim.mh>=source.mh*2?.15:.03}else return;const heal=Math.max(1,Math.round(victim.mh*.10));source.hp=Math.min(source.mh,source.hp+heal);source.slimeBonus=(source.slimeBonus||0)+bonus;TX.push({x:source.x,y:source.y-source.h-10,t:'+'+heal+' · СИЛА +'+bonus.toFixed(2),l:1,c:'#70d5ff'});fx(source.x,source.y-source.h*.55,8,'#55b9ff',180)}

function slimeCopy(e){const candidates=ents.filter(o=>o!==e&&o.hp>0&&!o.cl&&Math.hypot(o.x-e.x,(o.y-o.h*.5)-(e.y-e.h*.5))<(o.B?460:360)).map(o=>{const a=o.lastAbility&&G.t-o.lastAbility.time<=10?o.lastAbility:null,w=o.lastWeapon&&G.t-o.lastWeapon.time<=10?o.lastWeapon:null;let r=null;if(a&&w)r=a.time>=w.time?a:w;else r=a||w;return r?{o,r,d:Math.hypot(o.x-e.x,o.y-e.y)}:null}).filter(Boolean).sort((a,b)=>a.d-b.d);if(!candidates.length){slimeFail(e,'НЕТ СВЕЖИХ СИЛ РЯДОМ');return}const{ o:target,r}=candidates[0],count=e.copyCount||0,es=typeof evoSlimeStats13==='function'?evoSlimeStats13(e):{copyBase:1.3,copyDecay:.05,weaponFail:.3,cooldownExtra:5},factor=Math.max(.7,es.copyBase-es.copyDecay*count);if(r.kind==null&&r.id){if(R()<es.weaponFail){slimeFail(e,'КОПИРОВАНИЕ ОРУЖИЯ: СБОЙ');return}const w=WP[r.id];if(!w){slimeFail(e,'ОРУЖИЕ НЕ РАСПОЗНАНО');return}e.copyCount=count+1;e.wp=r.id;e.am=slimeWeaponAmmo(e,r.id);e.copyWeaponPower=Math.max(.1,(r.power||1)*factor);e.kc=5;e.kcMax=5;TX.push({x:e.x,y:e.y-e.h-20,t:'ОРУЖИЕ СКОПИРОВАНО · ×'+factor.toFixed(2),l:1.2,c:'#66c7ff'});fx(e.x,e.y-e.h*.5,20,'#299dff',280);return}e.copyCount=count+1;const power=(factor+(e.slimeBonus||0))*.6*.6,cooldown=(r.cooldown||8)+es.cooldownExtra,aid=slimeNextAttackId();e.kc=cooldown;e.kcMax=cooldown;TX.push({x:e.x,y:e.y-e.h-20,t:'СПОСОБНОСТЬ СКОПИРОВАНА · ×'+power.toFixed(2),l:1.3,c:'#66c7ff'});fx(e.x,e.y-e.h*.5,20,'#299dff',280);if(r.kind=='boss')slimeExecuteBossAbility(e,r.id,target,power,aid);else if(r.kind=='zombie')slimeExecuteZombieAbility(e,r.id,target,power,aid);else slimeExecuteClassAbility(e,r.id,target,power,aid)}
