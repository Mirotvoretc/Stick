services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stick-arena-game
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 8080
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: caddy:2-alpine
    container_name: stick-arena-proxy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Добавь DOMAIN в файл .env}
    depends_on:
      - game
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
