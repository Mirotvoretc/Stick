<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Stick Arena 2.17</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Neucha&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/00-foundation.css">
<link rel="stylesheet" href="css/10-stage-layout.css">
<link rel="stylesheet" href="css/20-ui-components.css">
<link rel="stylesheet" href="css/30-evolution-ui.css">
<link rel="stylesheet" href="css/40-touch-responsive.css">
<script>
(()=>{
  window.__SA_BOOTED=false;
  const showError=(error)=>{
    let panel=document.getElementById('sa-boot-error');
    if(!panel){
      panel=document.createElement('div');
      panel.id='sa-boot-error';
      Object.assign(panel.style,{position:'fixed',inset:'0',zIndex:'99999',display:'grid',placeItems:'center',padding:'22px',background:'#090e19',color:'#f2ecdc',font:'15px/1.5 system-ui,sans-serif'});
      const card=document.createElement('div');
      Object.assign(card.style,{width:'min(100%,620px)',padding:'24px',border:'1px solid #39465c',borderRadius:'16px',background:'#151f30',boxShadow:'0 18px 55px #0008'});
      const title=document.createElement('h2');
      title.textContent='Не удалось запустить Stick Arena';
      Object.assign(title.style,{margin:'0 0 10px',fontSize:'22px',color:'#ffcc77'});
      const body=document.createElement('p');
      body.textContent='Во время загрузки произошла ошибка. Перезагрузите страницу. Подробности ошибки:';
      const detail=document.createElement('pre');
      detail.id='sa-boot-error-detail';
      Object.assign(detail.style,{whiteSpace:'pre-wrap',overflowWrap:'anywhere',maxHeight:'32vh',overflow:'auto',padding:'12px',borderRadius:'9px',background:'#090e19',color:'#c9d6e8',fontSize:'12px'});
      const button=document.createElement('button');
      button.textContent='Перезагрузить игру';
      Object.assign(button.style,{marginTop:'14px',padding:'12px 18px',border:0,borderRadius:'9px',background:'#e7ac36',color:'#191d27',fontWeight:'700',fontSize:'15px'});
      button.addEventListener('click',()=>window.location.reload());
      card.append(title,body,detail,button);
      panel.appendChild(card);
      (document.getElementById('w')||document.body).appendChild(panel);
    }
    const detail=document.getElementById('sa-boot-error-detail');
    if(detail)detail.textContent=String(error&&error.stack?error.stack:error&&error.message?error.message:error||'Неизвестная ошибка').slice(0,2200);
  };
  window.__SA_SHOW_BOOT_ERROR=showError;
  window.addEventListener('error',event=>{if(!window.__SA_BOOTED)showError(event.error||event.message||'Ошибка JavaScript')});
  window.addEventListener('unhandledrejection',event=>{if(!window.__SA_BOOTED)showError(event.reason||'Ошибка загрузки модуля')});
})();
</script>
</head><body>

<div id="w"><canvas id="c"></canvas><div id="tc"></div>
<div class="sc" id="menu"><div class="box"><h1>STICK<br><span>ARENA</span></h1><p>Дуэли, боты, зомби-волны и боссы — вдвоём на одной клавиатуре</p><div class="mn"><button class="bt big" onclick="show('setup');rs()">PLAY</button><button class="bt" onclick="evoOpen(0)">Эволюции</button><button class="bt" onclick="hlp()">Клавиши и оружие</button></div></div></div>
<div class="sc" id="setup"><div class="box" id="sb"></div></div>
<div class="sc" id="evo"><div class="box" id="eb"></div></div>
<div class="sc" id="help"><div class="box" id="hb"></div></div>
<div class="sc" id="end"><div class="box" style="text-align:center"><h1 id="et"></h1><p id="es"></p><div class="row" style="justify-content:center"><button class="bt big" onclick="play()">Ещё раз</button><button class="bt" onclick="menu()">В меню</button></div></div></div>
<div class="sc" id="pause"><div class="box" style="text-align:center"><h1>ПАУЗА</h1><div class="row" style="justify-content:center"><button class="bt big" onclick="pause()">Продолжить</button><button class="bt" onclick="restartMatch()">Заново</button><button class="bt" onclick="menu()">В меню</button></div></div></div>
<div id="rot">Поверните телефон горизонтально</div></div>
